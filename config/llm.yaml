# LLM 评价链配置（消息面 r2 Phase 3，设计 r2 §6/§11）
# 边界（AGENTS.md/r2 §6.2 铁律）：LLM 只消费结构化底稿、只产出严格 JSON 评价；
# 不产生规范化数字（价格/收益只由确定性代码）、不预测价格、不建议买卖；
# action_hint 仅为提示不构成触发；activate/review 由人工执行。
#
# 启用方式：enabled: true 且导出 api_key_env 指定的环境变量。
# 未启用时 daily 的 LLM 阶段记 notes "llm disabled" 并跳过（非 degraded，属设计关闭）。

enabled: false
provider: zhipu                       # openai-compatible chat completions
base_url: https://open.bigmodel.cn/api/paas/v4
model: glm-4-flash
api_key_env: ZHIPUAI_API_KEY
temperature: 0.2
timeout_seconds: 30
max_retries: 3

# 成本护栏（r1 §6.3）
batch_size: 20                        # 事件级批量
max_concurrency: 8
max_llm_calls_per_run: 1200

# 混合人审 gate（r2 §6.3）：命中任一 → status='needs_review'
review_gate:
  high_materiality: [high, critical]
  low_confidence: 0.4
  company_tier_max: 2                 # company 层 source_tier ≤ 此值强制人审
  banned_words: [必涨, 必跌, 建议买入, 建议卖出, 目标价, 涨停, 抄底, 逃顶]

prompt_version: llm_v1
