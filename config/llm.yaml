# 消息面打标配置（r2 Phase 3）
# 打标通道：agent/skill（skills/message-tag-skill + scripts/llm/inputs.py），
# 原自动 API 通道已移除（执行日志续⑭）。本文件只剩人审 gate 与 prompt 版本。

# 混合人审 gate（r2 §6.3）：命中任一 → status='needs_review'，人工在
# /message-review 复核；未命中 → ok（可进报告"### 消息面"，人工仍可后补推翻）。
review_gate:
  high_materiality: [high, critical]
  low_confidence: 0.4
  company_tier_max: 2                 # company 层 source_tier ≤ 此值强制人审
  banned_words: [必涨, 必跌, 建议买入, 建议卖出, 目标价, 涨停, 抄底, 逃顶]

prompt_version: llm_v1
