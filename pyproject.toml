[project]
name = "trade-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "flask>=3.0.0",   # 只读 Web UI（scripts/ui）
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# 可选：akshare 采集器（scripts/collect/akshare_collect.py）
# 体积大（数十 MB），不进主依赖；需要时 uv sync --extra akshare 或 uv pip install akshare
[project.optional-dependencies]
akshare = [
    "akshare>=1.14.0",
]

# 可选：AKQuant 回测引擎（scripts/backtest/，Rust 内核体积大）
# 需要时 uv sync --extra backtest 或 uv pip install akquant
backtest = [
    "akquant>=0.3.52",
]
