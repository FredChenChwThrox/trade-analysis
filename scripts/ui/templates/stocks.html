{% extends "base.html" %}
{% block title %}股票列表 - 股票监测系统{% endblock %}
{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
  <!-- 筛选面板 -->
  <aside class="lg:col-span-3 card">
    <h3 class="card-title">筛选条件</h3>
    <form id="filter-form" class="space-y-3 text-sm">
      <div>
        <label class="block text-xs text-gray-500 mb-1">市场（多选）</label>
        <div class="flex flex-wrap gap-3">
          <label class="inline-flex items-center gap-1"><input type="checkbox" name="market" value="CN" class="market-cb"> CN</label>
          <label class="inline-flex items-center gap-1"><input type="checkbox" name="market" value="HK" class="market-cb"> HK</label>
        </div>
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">代码 / 名称 / 别名</label>
        <input type="text" name="q" id="stocks-q" class="w-full px-2 py-1 rounded border border-gray-300" placeholder="例如 珀莱雅 / 603605">
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">有 active 卡片</label>
        <select name="has_active_card" id="stocks-has-card" class="w-full px-2 py-1 rounded border border-gray-300">
          <option value="">全部</option>
          <option value="1">是</option>
          <option value="0">否</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">最近 N 天有触发信号</label>
        <input type="number" name="recent_signal_days" min="1" max="250" class="w-full px-2 py-1 rounded border border-gray-300" placeholder="如 5">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs text-gray-500 mb-1">PE(TTM) 最小</label>
          <input type="number" name="pe_min" step="any" class="w-full px-2 py-1 rounded border border-gray-300">
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">PE(TTM) 最大</label>
          <input type="number" name="pe_max" step="any" class="w-full px-2 py-1 rounded border border-gray-300">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs text-gray-500 mb-1">涨跌幅 ≥ %</label>
          <input type="number" name="pct_chg_min" step="any" class="w-full px-2 py-1 rounded border border-gray-300">
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">涨跌幅 ≤ %</label>
          <input type="number" name="pct_chg_max" step="any" class="w-full px-2 py-1 rounded border border-gray-300">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs text-gray-500 mb-1">成交量 ≥</label>
          <input type="number" name="volume_min" step="any" class="w-full px-2 py-1 rounded border border-gray-300">
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">成交量 ≤</label>
          <input type="number" name="volume_max" step="any" class="w-full px-2 py-1 rounded border border-gray-300">
        </div>
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">数据质量（pe_status）</label>
        <div id="pe-status-checks" class="space-y-1"></div>
      </div>
      <div class="flex gap-2 pt-1">
        <button type="submit" class="flex-1 px-3 py-1.5 rounded bg-blue-600 text-white hover:bg-blue-700">应用筛选</button>
        <button type="button" id="filter-reset-stocks" class="px-3 py-1.5 rounded border border-gray-300 hover:bg-gray-100">重置</button>
      </div>
    </form>
  </aside>

  <!-- 列表 -->
  <section class="lg:col-span-9">
    <div class="card mb-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h3 class="card-title mb-0">股票列表 <span id="stock-total" class="text-gray-400 font-normal"></span></h3>
        <div class="flex gap-2 text-sm">
          <button id="btn-compare" disabled class="px-3 py-1 rounded bg-emerald-600 text-white disabled:opacity-40 hover:bg-emerald-700">对比选中</button>
          <button id="btn-indicators" disabled class="px-3 py-1 rounded bg-indigo-600 text-white disabled:opacity-40 hover:bg-indigo-700">查看指标</button>
        </div>
      </div>
    </div>
    <div class="card overflow-x-auto">
      <table class="data-table">
        <thead>
          <tr>
            <th><input type="checkbox" id="check-all"></th>
            <th class="sortable" data-sort="symbol">Symbol</th>
            <th>名称 / 市场</th>
            <th class="sortable" data-sort="latest_trade_date">最新交易日</th>
            <th class="sortable" data-sort="latest_close">最新收盘</th>
            <th>复权因子</th>
            <th class="sortable" data-sort="pe_ttm">PE(TTM)</th>
            <th class="sortable" data-sort="pct_chg">涨跌幅</th>
            <th class="sortable" data-sort="signal_count_5d">近 5 日信号</th>
            <th>档位</th>
            <th>运行状态</th>
          </tr>
        </thead>
        <tbody id="stocks-tbody"></tbody>
      </table>
      <div id="stocks-empty" class="py-8 text-center text-gray-400 hidden">没有匹配的股票</div>
    </div>
    <div class="flex flex-wrap items-center justify-between gap-3 mt-3 text-sm">
      <div class="flex items-center gap-2">
        <span class="text-gray-500">每页</span>
        <select id="page-size" class="px-2 py-1 rounded border border-gray-300">
          <option>25</option><option selected>50</option><option>100</option>
        </select>
      </div>
      <div class="flex items-center gap-2">
        <span id="page-info" class="text-gray-500"></span>
        <button id="page-prev" class="px-3 py-1 rounded border border-gray-300 hover:bg-gray-100">上一页</button>
        <button id="page-next" class="px-3 py-1 rounded border border-gray-300 hover:bg-gray-100">下一页</button>
      </div>
    </div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/stocks.js') }}"></script>
{% endblock %}
