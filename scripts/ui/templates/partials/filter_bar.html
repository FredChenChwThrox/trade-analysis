<div id="global-filter-bar" class="bg-white border-b border-gray-200 shadow-sm">
  <div class="container mx-auto px-4 py-2">
    <div class="flex flex-wrap items-center gap-3 text-sm">
      <button type="button" id="filter-toggle"
              class="px-2 py-1 rounded border border-gray-300 hover:bg-gray-100" title="展开/收起筛选">
        筛选
      </button>
      <span class="text-xs text-gray-400">筛选条件随 URL 保持，刷新不丢失</span>
      <div class="hidden md:flex flex-wrap items-center gap-3 w-full md:w-auto" id="filter-body">
        <select id="filter-market" class="px-2 py-1 rounded border border-gray-300" multiple size="1"
                title="市场（多选）">
          <option value="CN">CN</option>
          <option value="HK">HK</option>
        </select>
        <input id="filter-q" type="text" placeholder="代码 / 名称 / 别名"
               class="px-2 py-1 rounded border border-gray-300 w-44" autocomplete="off">
        <input id="filter-start" type="date" class="px-2 py-1 rounded border border-gray-300">
        <span class="text-gray-400">~</span>
        <input id="filter-end" type="date" class="px-2 py-1 rounded border border-gray-300">
        <button type="button" id="filter-apply"
                class="px-3 py-1 rounded bg-blue-600 text-white hover:bg-blue-700">应用</button>
        <button type="button" id="filter-reset"
                class="px-3 py-1 rounded border border-gray-300 hover:bg-gray-100">重置</button>
        <div class="flex items-center gap-1 text-xs">
          <span class="text-gray-400">快捷：</span>
          <button type="button" data-quick="7" class="quick-btn px-2 py-1 rounded border border-gray-300 hover:bg-gray-100">近 7 天</button>
          <button type="button" data-quick="30" class="quick-btn px-2 py-1 rounded border border-gray-300 hover:bg-gray-100">近 30 天</button>
          <button type="button" data-quick="90" class="quick-btn px-2 py-1 rounded border border-gray-300 hover:bg-gray-100">近 90 天</button>
          <button type="button" data-quick="250" class="quick-btn px-2 py-1 rounded border border-gray-300 hover:bg-gray-100">近 1 年</button>
        </div>
      </div>
    </div>
  </div>
</div>
